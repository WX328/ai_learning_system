name: zhixing-v2
x-runtime: &runtime
  image: zhixing-v2:local
  build: .
  init: true
  user: "10001:10001"
  read_only: true
  tmpfs:
    - /tmp:size=128m,mode=1777
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 128
  mem_limit: 1g
  cpus: 1.0
  volumes:
    - learning-data:/data
    - learning-backups:/backups

services:
  migrate:
    <<: *runtime
    command: [python, -m, scripts.container_start]
    environment:
      APP_DATA_DIR: /data
      APP_BACKUP_DIR: /backups
      SQLITE_WAL: "true"
    restart: "no"
  app:
    <<: *runtime
    env_file:
      - path: ${APP_ENV_FILE:-.env.docker}
        required: true
    environment:
      APP_ENV: production
      APP_DATA_DIR: /data
      SQLITE_WAL: "true"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    # No host port: only the local proxy publishes a loopback port.
  proxy:
    image: nginxinc/nginx-unprivileged:1.28-alpine@sha256:7377697a821c131a924a7105fafbe7414db4e9fcc77a6f08f776f33f141ec3f8
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 128m
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8080/health/live"]
      interval: 20s
      timeout: 5s
      retries: 3
  maintenance:
    <<: *runtime
    profiles: [maintenance]
    environment:
      APP_DATA_DIR: /data
      APP_BACKUP_DIR: /backups
    command: [python, -m, scripts.data_backup, --help]
    restart: "no"

volumes:
  learning-data:
  learning-backups:
